{{/* JSON-LD Structured Data for SEO */}}

{{- $baseURL := site.BaseURL | default "" -}}

{{/* Organization Schema */}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.Title }}",
  "url": "{{ $baseURL }}",
  "description": "{{ site.Params.description }}",
  "logo": "{{ $baseURL }}favicon.svg",
  "sameAs": [],
  "contactPoint": {
    "@type": "ContactPoint",
    "email": "seven.sevenlights@gmail.com",
    "contactType": "customer service"
  }
}
</script>

{{/* WebSite Schema with Search Action */}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.Title }}",
  "url": "{{ $baseURL }}",
  "description": "{{ site.Params.description }}",
  "inLanguage": "en-US",
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.Title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ $baseURL }}favicon.svg"
    }
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ $baseURL }}search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

{{/* Page-specific structured data */}}
{{- if eq .Kind "home" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "{{ .Title }}",
  "description": "{{ .Params.description | default site.Params.description }}",
  "url": "{{ .Permalink }}",
  "inLanguage": "en-US",
  "isPartOf": {
    "@id": "{{ $baseURL }}#website"
  }
}
</script>
{{- else if eq .Kind "page" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ .Summary | truncate 200 }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "inLanguage": "en-US",
  "author": {
    "@type": "Organization",
    "name": "{{ site.Title }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.Title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ $baseURL }}favicon.svg"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
}
</script>
{{- end -}}
