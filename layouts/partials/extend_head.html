{{/* Custom head extensions for Anne Arundel Guide SEO */}}

<!-- Preload critical resources -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Canonical URL -->
{{- if .RelPermalink -}}
<link rel="canonical" href="{{ .Permalink }}">
{{- end -}}

<!-- Additional meta tags for social sharing -->
<meta name="author" content="Anne Arundel Guide">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

<!-- Hreflang for English -->
<link rel="alternate" hreflang="en" href="{{ .Permalink }}">
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">

<!-- Open Graph enhancements -->
{{- if .Params.image -}}
<meta property="og:image" content="{{ .Params.image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ .Title }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ .Params.image }}">
<meta name="twitter:image:alt" content="{{ .Title }}">
{{- else -}}
<meta property="og:image" content="{{ site.BaseURL }}og-default.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="{{ site.BaseURL }}og-default.jpg">
{{- end -}}

<meta property="og:site_name" content="Anne Arundel Guide">
<meta property="og:locale" content="en_US">

<!-- Twitter Card -->
<meta name="twitter:site" content="@AnneArundelGuide">
<meta name="twitter:creator" content="@AnneArundelGuide">

<!-- Structured Data (JSON-LD) -->
{{- partial "head/structured-data.html" . -}}

<!-- Custom theme CSS -->
{{- if (fileExists "static/css/anne-arundel-theme.css") -}}
<link rel="stylesheet" href="{{ "css/anne-arundel-theme.css" | absURL }}">
{{- end -}}

<!-- Additional SEO: DNS prefetch for common third-party domains -->
<link rel="dns-prefetch" href="//fonts.googleapis.com">
<link rel="dns-prefetch" href="//www.google-analytics.com">
