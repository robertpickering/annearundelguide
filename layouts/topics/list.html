<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  {{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  {{ partial "site-style" . }}
</head>
<body>
  {{ partial "site-navigation" . }}
  <main class="page-content">
    <div class="container">
      {{ .Content }}
    </div>
  </main>
  {{ partial "site-scripts" . }}
</body>
</html>
