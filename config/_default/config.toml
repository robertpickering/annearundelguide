baseURL = "https://annearundelguide.com/"
languageCode = "en-us"
title = "Anne Arundel Guide"
theme = "PaperMod"

enableRobotsTXT = true

canonifyURLs = true

# Permalinks for all sections - trailing slashes for SEO
[permalinks]
  page = "/:slug/"
  cities = "/:slug/"
  attractions = "/:slug/"
  guides = "/:slug/"
  pages = "/:slug/"
  categories = "/:slug/"
  tags = "/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
